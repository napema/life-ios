# Il progetto Xcode si genera da qui con XcodeGen (lo fa la compilazione su GitHub).
name: Life
options:
  bundleIdPrefix: it.life
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Life:
    type: application
    platform: iOS
    sources:
      - path: Life
        excludes:
          - Risorse/**
          - Info.plist
      - path: Life/Risorse
        buildPhase: resources
    info:
      path: Life/Info.plist
      properties:
        CFBundleDisplayName: Life
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Sfondo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - life.aggiornamento
        NSCameraUsageDescription: Per scattare le foto dei progressi di Mobilità.
        NSPhotoLibraryUsageDescription: Per scegliere le foto dei progressi di Mobilità.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.life.app
